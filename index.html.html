<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبارات | تقنيات انترنت متقدمة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --accent: #7c3aed;
    --accent2: #a78bfa;
    --green: #10b981;
    --red: #ef4444;
    --yellow: #f59e0b;
    --text: #e6edf3;
    --text2: #8b949e;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    min-height: 100vh;
  }

  /* ========= HOME ========= */
  #home {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: radial-gradient(ellipse at top, #1a0533 0%, var(--bg) 60%);
  }

  #home h1 {
    font-size: clamp(1.6rem, 4vw, 2.6rem);
    font-weight: 900;
    text-align: center;
    background: linear-gradient(135deg, #a78bfa, #7c3aed, #c4b5fd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  #home .subtitle {
    color: var(--text2);
    font-size: 1rem;
    margin-bottom: 48px;
    text-align: center;
  }

  .chapters-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 900px;
  }

  .chapter-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 16px;
    text-align: right;
  }

  .chapter-card:hover {
    border-color: var(--accent);
    background: var(--surface2);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(124,58,237,0.2);
  }

  .chapter-num {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #5b21b6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    font-weight: 900;
    flex-shrink: 0;
    color: white;
  }

  .chapter-info h3 {
    font-size: 0.95rem;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .chapter-info p {
    font-size: 0.8rem;
    color: var(--text2);
  }

  /* ========= QUIZ ========= */
  #quiz-screen {
    display: none;
    min-height: 100vh;
    padding: 24px 16px;
    max-width: 760px;
    margin: 0 auto;
  }

  .quiz-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
  }

  .back-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.9rem;
    transition: all 0.2s;
  }

  .back-btn:hover { border-color: var(--accent2); }

  .quiz-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent2);
  }

  .progress-bar-wrap {
    background: var(--surface);
    border-radius: 99px;
    height: 6px;
    margin-bottom: 28px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .q-counter {
    color: var(--text2);
    font-size: 0.85rem;
    margin-bottom: 16px;
  }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 24px;
    margin-bottom: 16px;
  }

  .question-text {
    font-size: 1.05rem;
    font-weight: 600;
    line-height: 1.7;
    margin-bottom: 24px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.95rem;
    color: var(--text);
    text-align: right;
    line-height: 1.6;
  }

  .option:hover:not(.disabled) {
    border-color: var(--accent2);
    background: #1e1337;
  }

  .option.correct {
    border-color: var(--green);
    background: rgba(16,185,129,0.1);
    color: #6ee7b7;
  }

  .option.wrong {
    border-color: var(--red);
    background: rgba(239,68,68,0.1);
    color: #fca5a5;
  }

  .option.disabled { cursor: default; }

  .feedback {
    margin-top: 16px;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 0.9rem;
    line-height: 1.7;
    display: none;
  }

  .feedback.show { display: block; }
  .feedback.correct-fb { background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; }
  .feedback.wrong-fb { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }

  .nav-btns {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
    margin-top: 20px;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #5b21b6);
    color: white;
    border: none;
    padding: 12px 28px;
    border-radius: 10px;
    font-family: 'Tajawal', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.4; cursor: default; }

  /* ========= RESULT ========= */
  #result-screen {
    display: none;
    min-height: 100vh;
    padding: 40px 20px;
    max-width: 600px;
    margin: 0 auto;
    text-align: center;
  }

  .score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: conic-gradient(var(--accent) var(--pct), var(--surface2) 0);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    position: relative;
  }

  .score-circle::before {
    content: '';
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: var(--surface);
    position: absolute;
  }

  .score-num {
    position: relative;
    z-index: 1;
    font-size: 2rem;
    font-weight: 900;
  }

  .result-title {
    font-size: 1.5rem;
    font-weight: 900;
    margin-bottom: 8px;
  }

  .result-sub {
    color: var(--text2);
    margin-bottom: 32px;
  }

  .result-breakdown {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    text-align: right;
    margin-bottom: 24px;
  }

  .result-breakdown h3 {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--accent2);
    margin-bottom: 16px;
  }

  .rb-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.88rem;
    gap: 12px;
  }

  .rb-item:last-child { border-bottom: none; }
  .rb-item .q-text { color: var(--text2); flex: 1; line-height: 1.6; }
  .rb-ok { color: var(--green); font-size: 1.1rem; }
  .rb-no { color: var(--red); font-size: 1.1rem; }

  .result-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  .btn-secondary {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 24px;
    border-radius: 10px;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-secondary:hover { border-color: var(--accent2); }
</style>
</head>
<body>

<!-- HOME -->
<div id="home">
  <h1>🎓 اختبارات تقنيات انترنت متقدمة</h1>
  <p class="subtitle">إعداد المدربة / دانيه الموسى &nbsp;|&nbsp; اختر الشابتر اللي تبيه تختبر فيه</p>
  <div class="chapters-grid" id="chaptersGrid"></div>
</div>

<!-- QUIZ -->
<div id="quiz-screen">
  <div class="quiz-header">
    <button class="back-btn" onclick="goHome()">← رجوع</button>
    <span class="quiz-title" id="quizTitle"></span>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="q-counter" id="qCounter"></div>
  <div class="question-card">
    <div class="question-text" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="nav-btns">
    <button class="btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>التالي ←</button>
  </div>
</div>

<!-- RESULT -->
<div id="result-screen">
  <div class="score-circle" id="scoreCircle">
    <span class="score-num" id="scoreNum"></span>
  </div>
  <div class="result-title" id="resultTitle"></div>
  <div class="result-sub" id="resultSub"></div>
  <div class="result-breakdown">
    <h3>مراجعة الإجابات</h3>
    <div id="breakdownList"></div>
  </div>
  <div class="result-actions">
    <button class="btn-primary" onclick="retryQuiz()">🔄 إعادة الاختبار</button>
    <button class="btn-secondary" onclick="goHome()">🏠 الرئيسية</button>
  </div>
</div>

<script>

let currentChapter = null;
let currentQ = 0;
let answers = [];
let answered = false;

function goHome() {
  document.getElementById('home').style.display = 'flex';
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'none';
}

function startQuiz(idx) {
  currentChapter = CHAPTERS[idx];
  currentQ = 0;
  answers = new Array(currentChapter.questions.length).fill(null);
  answered = false;

  // Shuffle questions
  currentChapter.questions = shuffle([...CHAPTERS[idx].questions]);

  document.getElementById('home').style.display = 'none';
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  document.getElementById('quizTitle').textContent = currentChapter.title;
  renderQuestion();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function renderQuestion() {
  const q = currentChapter.questions[currentQ];
  const total = currentChapter.questions.length;

  document.getElementById('qCounter').textContent = `السؤال ${currentQ + 1} من ${total}`;
  document.getElementById('progressBar').style.width = `${((currentQ) / total) * 100}%`;
  document.getElementById('questionText').textContent = q.q;

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    container.appendChild(btn);
  });

  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.textContent = '';

  document.getElementById('nextBtn').disabled = true;
  answered = false;
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;

  const q = currentChapter.questions[currentQ];
  answers[currentQ] = idx;

  const opts = document.querySelectorAll('.option');
  opts.forEach(o => o.classList.add('disabled'));
  opts[q.ans].classList.add('correct');

  const fb = document.getElementById('feedback');
  if (idx === q.ans) {
    fb.className = 'feedback correct-fb show';
    fb.innerHTML = '✅ إجابة صحيحة! ' + q.exp;
  } else {
    opts[idx].classList.add('wrong');
    fb.className = 'feedback wrong-fb show';
    fb.innerHTML = '❌ إجابة خاطئة. ' + q.exp;
  }

  document.getElementById('nextBtn').disabled = false;
  const isLast = currentQ === currentChapter.questions.length - 1;
  document.getElementById('nextBtn').textContent = isLast ? 'عرض النتيجة 🏆' : 'التالي ←';
}

function nextQuestion() {
  if (!answered) return;
  const isLast = currentQ === currentChapter.questions.length - 1;
  if (isLast) {
    showResults();
  } else {
    currentQ++;
    renderQuestion();
  }
}

function showResults() {
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';

  const total = currentChapter.questions.length;
  const correct = answers.filter((a, i) => a === currentChapter.questions[i].ans).length;
  const pct = Math.round((correct / total) * 100);

  document.getElementById('scoreNum').textContent = `${correct}/${total}`;
  document.getElementById('scoreCircle').style.setProperty('--pct', `${pct}%`);

  let title = '', sub = '';
  if (pct >= 90) { title = '🌟 ممتاز!'; sub = 'أداء رائع، أنتِ جاهزة تماماً!'; }
  else if (pct >= 75) { title = '👍 جيد جداً!'; sub = 'نتيجة قوية، راجعي الأسئلة اللي خطأت فيها.'; }
  else if (pct >= 60) { title = '📚 جيد'; sub = 'راجعي المحتوى مرة ثانية وأعيدي الاختبار.'; }
  else { title = '💪 تحتاج مراجعة'; sub = 'لا تيأسين، راجعي الملزمة وحاولي مرة ثانية!'; }

  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultSub').textContent = sub;

  const list = document.getElementById('breakdownList');
  list.innerHTML = '';
  currentChapter.questions.forEach((q, i) => {
    const isCorrect = answers[i] === q.ans;
    const div = document.createElement('div');
    div.className = 'rb-item';
    div.innerHTML = `<span class="${isCorrect ? 'rb-ok' : 'rb-no'}">${isCorrect ? '✓' : '✗'}</span><span class="q-text">${q.q}</span>`;
    list.appendChild(div);
  });
}

function retryQuiz() {
  const idx = CHAPTERS.findIndex(c => c.id === currentChapter.id);
  startQuiz(idx);
}

// Build home grid
const grid = document.getElementById('chaptersGrid');
CHAPTERS.forEach((ch, i) => {
  const card = document.createElement('div');
  card.className = 'chapter-card';
  card.innerHTML = `
    <div class="chapter-num">${ch.id}</div>
    <div class="chapter-info">
      <h3>${ch.title}</h3>
      <p>${ch.sub}</p>
    </div>`;
  card.onclick = () => startQuiz(i);
  grid.appendChild(card);
});
